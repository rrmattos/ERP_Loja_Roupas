# =============================================================================
# CONFIGURAÇÃO OPCIONAL DO FAIL2BAN PARA A API DO ERP
# O backend Node.js emite logs padronizados no formato:
# [SECURITY_AUTH_FAIL] ip=203.0.113.5 reason=INVALID_CREDENTIALS email=...
# =============================================================================
# 1. Filtro (/etc/fail2ban/filter.d/erp-auth.conf):
[Definition]
failregex = ^.*\[SECURITY_AUTH_FAIL\] ip=<HOST> .*$
ignoreregex =

# 2. Jail (/etc/fail2ban/jail.d/erp-auth.local):
# [erp-auth]
# enabled  = true
# filter   = erp-auth
# action   = iptables-multiport[name=ERPAuth, port="http,https", protocol=tcp]
# logpath  = /var/lib/docker/containers/*/*-json.log
# maxretry = 8
# findtime = 600
# bantime  = 3600

