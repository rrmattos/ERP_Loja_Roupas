server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Oculta versão do Nginx por segurança
    server_tokens off;

    # Cache longo para assets com hash do Vite
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Suporte ao React Router (SPA Fallback)
    location / {
        try_files $uri $uri/ /index.html;
    }
}

